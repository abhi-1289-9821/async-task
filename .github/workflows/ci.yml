name: CI & Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Backend Tests (SQLite & Postgres) & Frontend Build/Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: test_billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt || true
          pip install psycopg2-binary pytest pytest-asyncio hypothesis

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Dependencies, Lint, Build & Vitest
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run test
          npm run build

      - name: Verify Alembic Migrations & Schema Drift on Clean Postgres 16
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/test_billing
        run: |
          cd backend
          alembic upgrade head
          alembic check

      - name: Run API Smoke Test on Clean PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/test_billing
          LLM_MODE: mock
          DEMO_MODE: "true"
        run: |
          cd backend
          pytest tests/test_api_smoke.py -v

      - name: Run Backend Test Suite (SQLite & Real PostgreSQL)
        env:
          LLM_MODE: mock
          POSTGRES_TEST_URL: postgresql://postgres:postgrespassword@localhost:5432/test_billing
        run: |
          cd backend
          pytest -v
