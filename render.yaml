services:
  - type: web
    name: fairbill
    runtime: python
    buildCommand: cd frontend && npm ci && npm run build && cd .. && pip install -r backend/requirements.txt
    preDeployCommand: cd backend && alembic upgrade head
    startCommand: cd backend && alembic upgrade head && cd .. && uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: 20
      - key: ENVIRONMENT
        value: production
      - key: LLM_MODE
        value: real
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: LLM_PROVIDERS
        value: gemini,groq,openrouter
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: INVESTIGATION_RUN_TTL_SECONDS
        value: "180"
      - key: ALLOW_MOCK_FALLBACK
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEMO_REVIEWER_TOKEN
        sync: false
      - key: DEMO_VIEWER_TOKEN
        sync: false
      - key: REVIEWER_TOKENS
        sync: false
