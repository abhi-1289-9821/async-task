services:
  - type: web
    name: billing-dispute-agent
    runtime: python
    buildCommand: cd frontend && npm ci && npm run build && cd .. && pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: 20
      - key: ENVIRONMENT
        value: production
      - key: LLM_MODE
        value: real
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_PROVIDERS
        value: gemini,groq,openrouter
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEMO_REVIEWER_TOKEN
        sync: false
      - key: DEMO_VIEWER_TOKEN
        sync: false

